[package]
name = "joule"
version = "0.0.1"
edition = "2021"
description = "Puddle: on-device companion for Claude Code and Codex usage"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-notification = "=2.7.0"
serde_json = "1"
# the menu bar's own light or dark (it follows the wallpaper too), read from the tray icon's button: the same
# versions tauri's tray already uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSAppearance"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
