<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><link rel="icon" href="/brand/icon.svg">
  <script>try { const q = new URLSearchParams(location.search).get("theme"), t = /^(auto|light|dark)$/.test(q || "") ? q : localStorage.getItem("cu-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
  <style>html{background:#f7f2e9}@media (prefers-color-scheme:dark){html:not([data-theme=light]){background:#17151a}}html[data-theme=dark]{background:#17151a}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Puddle</title>
  <link rel="preload" href="/vendor/outfit-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/tokens.css"><script src="/squircle.js"></script><link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img class="mark" src="/brand/icon.svg" alt=""><b>Puddle</b></div>
    <ol class="steps" id="steps" aria-label="Setup steps"></ol>
    <button class="icon-btn" id="theme" type="button" aria-label="Theme" title="Theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10" opacity=".28"/><path d="M12 2a10 10 0 0 1 0 20z"/></svg>
    </button>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="proto">
    <span class="tag">Prototype</span>
    <label class="switch-row"><input type="checkbox" id="sim-invite"> Pretend I opened a team invite</label>
    <button type="button" class="link" id="restart">Reset onboarding</button>
    <button type="button" class="link" data-go="menubar">Menu bar view</button>
  </footer>
  <script src="/theme.js"></script>
  <script src="/agents.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
