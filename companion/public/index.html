<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Puddle</title>
  <link rel="stylesheet" href="/tokens.css"><script src="/squircle.js"></script><link rel="stylesheet" href="/style.css">
  <script>try { const q = new URLSearchParams(location.search).get("theme"), t = /^(auto|light|dark)$/.test(q || "") ? q : localStorage.getItem("cu-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><b>Puddle</b></div>
    <ol class="steps" id="steps" aria-label="Setup steps"></ol>
    <button class="icon-btn" id="theme" type="button" aria-label="Theme" title="Theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10" opacity=".28"/><path d="M12 2a10 10 0 0 1 0 20z"/></svg>
    </button>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="proto">
    <span class="tag">Prototype</span>
    <label class="switch-row"><input type="checkbox" id="sim-invite"> Pretend I opened a team invite</label>
    <button type="button" class="link" id="restart">Reset onboarding</button>
    <button type="button" class="link" data-go="menubar">Menu bar view</button>
  </footer>
  <script src="/theme.js"></script>
  <script src="/agents.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
