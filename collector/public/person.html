<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="/brand/icon.svg"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try { const q = new URLSearchParams(location.search).get("theme"), t = /^(auto|light|dark)$/.test(q || "") ? q : localStorage.getItem("cu-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>html{background:#f7f2e9}@media (prefers-color-scheme:dark){html:not([data-theme=light]){background:#17151a}}html[data-theme=dark]{background:#17151a}</style>
<title>Puddle</title>
<link rel="preload" href="/vendor/outfit-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/tokens.css"><script src="/squircle.js"></script><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/cards.css"><link rel="stylesheet" href="/you.css">
</head>
<body>
<header class="bar" data-page="person"></header><script src="/bar.js"></script>
<main class="pv" id="pv" aria-busy="true">
  <div class="pv-bar"><span class="sk sk-line" style="width:110px"></span></div>
  <section class="card sk" data-card="work" style="height:228px"></section><section class="card sk" data-card="flags" style="height:200px"></section>
  <section class="card sk" data-card="recent" style="height:300px"></section><section class="card sk" data-card="hands" style="height:70px"></section>
</main>
<script src="/shape.js"></script>
<script src="/perf.js"></script><script src="/selfheal.js"></script><script src="/theme.js"></script>
<script src="/learn.js"></script>
<script src="/nav.js"></script>
<script src="/calendar.js"></script><script src="/projects.js"></script><script src="/agents.js"></script><script src="/signals.js"></script><script src="/lines.js"></script><script src="/prompts.js"></script><script src="/motion.js"></script><script src="/layout.js"></script>
<script type="module">
import { mountPerson } from '/person.js';
const q = new URLSearchParams(location.search), team = q.get('team'), user = q.get('user'), demo = q.get('demo');
const extra = [team && `team=${encodeURIComponent(team)}`, user && `user=${encodeURIComponent(user)}`, demo && 'demo=1'].filter(Boolean).join('&');
const scope = demo ? 'demo=1&' : team ? `team=${encodeURIComponent(team)}&` : '';
document.title = user ? 'Puddle' : 'Me · Puddle';
mountPerson(document.getElementById('pv'), {
  api: ({ from, to, tz }) => `/api/person?from=${from}&to=${to}&tz=${tz}${extra ? '&' + extra : ''}`,
  cards: (name, { from, to, tz }) => `/api/cards/${name}?from=${from}&to=${to}&tz=${tz}${extra ? '&' + extra : ''}`,
  stream: `/api/stream${team ? `?team=${encodeURIComponent(team)}` : demo ? '?demo=1' : ''}`,
  you: !user,
  links: {
    project: (c, range) => `/project?${scope}p=${encodeURIComponent(c.project)}&range=${range}&c=${encodeURIComponent(c.session_id)}&${globalThis.PuddleBar?.from(user ? document.body.dataset.who || 'their page' : 'Me') || ''}`,
    work: (range) => `/work?${scope}range=${range}${user ? `&person=${encodeURIComponent(user)}` : ''}&${globalThis.PuddleBar?.from(user ? document.body.dataset.who || 'their page' : 'Me') || ''}`,
  },
});
</script>
</body>
</html>
