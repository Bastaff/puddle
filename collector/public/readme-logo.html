<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puddle logo banner</title>
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';</script>
<link rel="preload" href="/vendor/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/you.css">
<style>
  :root { --gh: #ffffff; --chip: #fffdf8; --edge: rgba(31, 27, 22, .08); }
  :root[data-theme="dark"] { --gh: #0d1117; --chip: #1d1b21; --edge: rgba(255, 255, 255, .08); }
  html, body { margin: 0; background: #e9e3d8; }
  :root[data-theme="dark"] body { background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .banner { position: relative; width: 1280px; height: 400px; overflow: hidden; background: var(--gh); font-family: var(--font); color: var(--ink); }
  .banner > * { position: absolute; }
  .logo { left: 490px; top: 92px; width: 300px; }
  .logo img { width: 100%; height: auto; display: block; }
  .logo .on-dark, :root[data-theme="dark"] .logo .on-light { display: none; }
  :root[data-theme="dark"] .logo .on-dark { display: block; }
  .bit { background: var(--chip); border-radius: 20px; box-shadow: 0 10px 28px rgba(0, 0, 0, .08), 0 0 0 1px var(--edge); padding: 14px 16px; will-change: transform; }
  .bit h4 { margin: 0 0 6px; font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
  .bit b { display: block; font-size: 30px; font-weight: 900; letter-spacing: -.025em; line-height: 1; font-variant-numeric: tabular-nums; }
  .bit small { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .today { left: 96px; top: 56px; width: 250px; height: 132px; }
  .today .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: flex-end; gap: 2px; padding: 0 0; }
  .today .bars { overflow: hidden; border-radius: 0 0 20px 20px; }
  .today .bars i { flex: 1; height: 100%; position: relative; }
  .today .bars i s, .today .bars i em { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px 3px 0 0; }
  .today .bars i s { background: var(--ghost); }
  .today .bars i em { background: var(--s2); }
  .days { left: 186px; top: 226px; width: 236px; }
  .days .sq { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 8px; }
  .days .sq i { aspect-ratio: 1; border-radius: 7px; background: var(--cal0); position: relative; overflow: hidden; }
  .days .sq i span { position: absolute; inset: 0; border-radius: 7px; background: linear-gradient(180deg, var(--s3) 0 30%, var(--s1) 30% 80%, var(--s7) 80%); transform-origin: 50% 50%; }
  .ring { left: 930px; top: 52px; width: 156px; }
  .ring svg { display: block; margin: 6px auto 0; }
  .ship { left: 996px; top: 238px; width: 210px; height: 112px; }
  .ship svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 56px; overflow: hidden; border-radius: 0 0 20px 20px; }
  .lev { left: 846px; top: 270px; width: 120px; height: 92px; padding: 12px 14px; }
  .lev .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: flex-end; gap: 2px; overflow: hidden; border-radius: 0 0 20px 20px; }
  .lev .bars i { flex: 1; background: var(--s4); border-radius: 3px 3px 0 0; }
  .lev .bars i.top { background: var(--s2); }
  .lev b { font-size: 24px; }
  .plan { left: 40px; top: 238px; width: 112px; }
  .plan .cr-plan { display: inline-flex; transform: scale(1.35); transform-origin: 0 50%; margin-top: 8px; }
</style></head>
<body>
<div class="banner" aria-label="Puddle">
  <div class="logo"><img class="on-light" src="/brand/logo-light.svg" alt="Puddle" width="657" height="428"><img class="on-dark" src="/brand/logo-dark.svg" alt="" width="657" height="428"></div>
  <div class="bit today" data-ph="0"><h4>Today</h4><b data-n="today">0 min</b><div class="bars"></div></div>
  <div class="bit days" data-ph=".33"><h4>Days</h4><div class="sq"></div></div>
  <div class="bit ring" data-ph=".66"><h4>Hands-off</h4><svg viewBox="0 0 100 100" width="96" height="96"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--cal0)" stroke-width="18"/><circle class="arc" cx="50" cy="50" r="38" fill="none" stroke="var(--s3)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="19" font-weight="900" fill="currentColor" data-n="hands">0%</text></svg></div>
  <div class="bit ship" data-ph=".2"><h4>Shipped</h4><b data-n="ship">+0</b><svg viewBox="0 0 100 40" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--s3)" stop-opacity=".42"/><stop offset="1" stop-color="var(--s3)" stop-opacity="0"/></linearGradient></defs><path class="area" fill="url(#g)"/><path class="line" fill="none" stroke="var(--s3)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>
  <div class="bit lev" data-ph=".5"><h4>Leverage</h4><b data-n="lev">0.0</b><div class="bars"></div></div>
  <div class="bit plan" data-ph=".8"><h4>Limits</h4><div class="pill"></div></div>
</div>
<script type="module" src="/readme-logo.js"></script>
</body></html>
