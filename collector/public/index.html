<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Claude Usage</title>
  <link rel="stylesheet" href="/tokens.css"><script src="/squircle.js"></script><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/cards.css">
  <script>try { const q = new URLSearchParams(location.search).get("theme"), t = /^(auto|light|dark)$/.test(q || "") ? q : localStorage.getItem("cu-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <b>Usage</b>
      <i id="live" class="dot" title="Live connection"></i>
      <button class="demo-badge" type="button" data-act="demo" data-learn="bar:demo" title="Synthetic demo team — click to return to your data">Demo</button>
    </div>
    <nav class="seg" id="range" aria-label="Date range" data-learn="bar:range">
      <button data-r="today">1D</button><button data-r="7d" aria-pressed="true">7D</button><button data-r="30d">30D</button><button data-r="90d">90D</button>
    </nav>
    <button class="pill demo-btn" id="demo-btn" type="button" data-act="demo" aria-pressed="false" data-learn="bar:demo" title="A synthetic demo team to try things on. Your data is untouched.">Demo</button>
    <button class="icon-btn learn-btn" id="learn-btn" type="button" aria-pressed="false" aria-label="Learn mode" data-learn="bar:learn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10" opacity=".28"/><path d="M9 9.4a3 3 0 1 1 4.3 2.7c-.9.5-1.3 1.1-1.3 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="17.6" r="1.6"/></svg>
    </button>
    <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Theme" title="Theme" data-learn="bar:theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10" opacity=".28"/><path d="M12 2a10 10 0 0 1 0 20z"/></svg>
    </button>
    <button class="icon-btn sound-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Sounds" title="Sounds" data-learn="bar:sound">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3.5 9.2c0-.7.6-1.2 1.2-1.2h2.6l4.6-3.6c.8-.6 1.9 0 1.9 1v13.2c0 1-1.1 1.6-1.9 1L7.3 16H4.7c-.6 0-1.2-.5-1.2-1.2z"/><path class="waves" d="M16.4 8.6a4.8 4.8 0 0 1 0 6.8M18.9 6.1a8.3 8.3 0 0 1 0 11.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/><g class="mute"><circle cx="19" cy="12" r="4.4" opacity=".28"/><path d="M17.3 10.3l3.4 3.4M20.7 10.3l-3.4 3.4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></g></svg>
    </button>
    <button class="pill" id="health-pill" type="button" aria-haspopup="dialog" data-learn="bar:health"><i class="dot"></i><span>…</span></button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Actions">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" data-act="test">▶︎ Run test</button>
        <button role="menuitem" data-act="recover">↻ Recover now</button>
        <button role="menuitemcheckbox" data-act="demo" id="demo-toggle" aria-checked="false">◎ Demo team</button>
        <hr>
        <button role="menuitem" data-act="reset" class="danger">✕ Reset data</button>
      </div>
    </div>
  </header>

  <!-- every card carries data-card: its owner arranges, sizes and hides them (layout.js) -->
  <main class="grid" id="grid">
    <section class="kpis headline" id="kpis" data-card="kpis" aria-label="Team at a glance"><div class="kpi sk"></div><div class="kpi sk"></div><div class="kpi sk"></div><div class="kpi sk"></div><div class="kpi sk"></div><div class="kpi sk"></div></section>
    <section class="card people-card" data-card="people" aria-label="Team">
      <header><h2 data-learn="card:team">Team</h2></header>
      <div class="ptable" id="ptable" role="table" aria-label="Usage per person"></div>
    </section>
    <section class="card issues" data-card="issues" aria-label="Needs a look">
      <header><h2 data-learn="card:issues">Needs a look</h2><span class="chip" id="att-count"></span></header>
      <ul class="attention" id="attention"></ul>
      <div class="att-acc muted" id="att-acc"></div>
    </section>
    <section class="card where" data-card="map" aria-label="Where the team is">
      <div class="map" id="map" role="img" aria-label="Where the team is" data-learn="card:map"></div>
    </section>
    <section class="card models" data-card="models" aria-label="Models, effort and clients">
      <header><h2 data-learn="card:models">Models · effort · client</h2></header>
      <div id="models" class="mixbars"></div>
    </section>
    <section class="card projects" id="projects-card" data-card="recent" aria-label="Projects" hidden>
      <header><h2 data-learn="card:projects">Active Projects</h2></header>
      <div class="projects-list" id="projects"></div>
    </section>
    <section class="card code-lines" id="lines-card" data-card="lines" aria-label="Code changes">
      <header><h2 data-learn="card:lines">Code changes</h2></header>
      <div id="lines"></div>
    </section>
    <section class="card rhythm" data-card="calendar" aria-label="Tokens per day">
      <header><h2 data-learn="card:rhythm">Tokens per day</h2></header>
      <div class="cal" id="heat" data-learn="card:rhythm"></div>
    </section>
    <section class="card adoption" data-card="features" aria-label="Features in use">
      <header><h2 data-learn="card:features">Features in use</h2></header>
      <div class="feats" id="adoption"></div>
      <div class="named-list" id="named"></div>
    </section>
    <section class="card mix" data-card="mix" aria-label="What the team does">
      <header><h2 id="mix-title" data-learn="card:mix">What the team does</h2></header>
      <div id="tools" class="hbars"></div>
    </section>
  </main>

  <!-- Health & recovery: details on demand -->
  <dialog class="sheet" id="health-sheet" aria-labelledby="hs-title">
    <header><h2 id="hs-title">System</h2><button class="icon-btn" data-close aria-label="Close">✕</button></header>
    <div class="hs-grid" id="hs-grid"></div>
    <div id="hs-check"></div>
    <div id="hs-incidents"></div>
    <div class="hs-actions">
      <button class="btn" data-act="recover">↻ Recover now</button>
    </div>
  </dialog>

  <dialog class="sheet" id="reset-dlg" aria-labelledby="reset-title">
    <header><h2 id="reset-title">Delete all data?</h2><button class="icon-btn" data-close aria-label="Close">✕</button></header>
    <p class="muted">Events, sessions, people and backups. Tracking stays on. Type <b>RESET</b>.</p>
    <form id="reset-form" class="row-form">
      <input id="reset-input" autocomplete="off" spellcheck="false" aria-label="Type RESET to confirm">
      <button id="reset-go" class="btn danger solid" type="submit" disabled>Delete</button>
    </form>
  </dialog>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="/vendor/d3-array.min.js"></script>
  <script src="/vendor/d3-geo.min.js"></script>
  <script src="/vendor/topojson-client.min.js"></script>
  <script src="/motion.js"></script>
  <script src="/learn.js"></script>
  <script src="/perf.js"></script><script src="/selfheal.js"></script><script src="/theme.js"></script>
  <script src="/calendar.js"></script><script src="/projects.js"></script><script src="/agents.js"></script><script src="/signals.js"></script><script src="/lines.js"></script>
  <script src="/layout.js"></script>
  <script src="/app.js"></script>
</body>
</html>
